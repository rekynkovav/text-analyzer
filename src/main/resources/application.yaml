spring:
  application:
    name: text-analyzer

logging:
  level:
    com.example.textanalyzer: DEBUG
    com.example.textanalyzer.processor: TRACE
    com.example.textanalyzer.writer: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %level - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} - %level - %msg%n"
  file:
    name: logs/text-analyzer.log
    max-size: 10MB
    max-history: 7